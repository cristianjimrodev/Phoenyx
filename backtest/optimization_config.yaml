optimization:
  objective: sharpe_ratio
  initial_balance: 10000
  min_confidence: 60
  parameters:
    - path: weights.support_resistance
      values: [0.25, 0.30, 0.35, 0.40]
    - path: weights.patterns
      values: [0.20, 0.25, 0.30, 0.35]
    - path: weights.indicators
      values: [0.20, 0.25, 0.30]
    # RSI period intentionally excluded - stays at 14
    - path: indicators.macd.fast
      values: [8, 10, 12]
    - path: indicators.macd.slow
      values: [21, 26, 30]
    - path: indicators.bollinger.period
      values: [15, 20, 25]
