# Per-asset parameter sets for TopDownStrategy.
# Each asset can override any parameter. Unlisted params fall back to "default".

default:
  timeframes:
    trend: W1           # global trend
    confirmation: D1    # intermediate confirmation
    entry: H4           # entry/exit signals
  trend_durations:
    W1: "10 Y"
    D1: "1 Y"
    H4: "10 M"
  rsi:
    period: 14
    oversold: 35
    overbought: 65
    deep_oversold: 25
    deep_overbought: 75
  stochastic:
    k_period: 5
    d_period: 3
    smooth: 3
    oversold: 25
    overbought: 75
  atr:
    period: 14
    sl_multiplier: 1.5
    tp_multiplier: 3.0   # 2:1 R:R
  min_confidence: 80

# ──────────── Forex ────────────

EURUSD:
  sr_bounce_entry: false   # S/R bounce generates noise on EURUSD
  divergence_entry: false  # pure RSI/Stoch works better
  rsi:
    oversold: 35
    overbought: 65
    deep_oversold: 25
    deep_overbought: 75
  stochastic:
    oversold: 25
    overbought: 75
  atr:
    sl_multiplier: 1.5
    tp_multiplier: 3.0
  min_confidence: 80

EURCHF:  # CHF pairs: SNB interventions, erratic
  sr_bounce_entry: false
  divergence_entry: false
  rsi: { oversold: 30, overbought: 70, deep_oversold: 20, deep_overbought: 80 }
  stochastic: { oversold: 20, overbought: 80 }
  atr: { sl_multiplier: 2.0, tp_multiplier: 4.0 }
  min_confidence: 90

